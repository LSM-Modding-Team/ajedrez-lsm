.draw-bottom .btn{font-size:clamp(15px,1.1vw,20px);padding:14px 24px}
.draw-admin p{color:var(--ink-muted)}.draw-admin-groups{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px;max-width:1300px}
.draw-admin-groups .draw-slot{min-height:70px;padding:14px 18px}.draw-admin-groups .draw-player{font-size:var(--body-size,16px)}
@media(min-width:1000px){
 .page-publico-secundaria:not(.draw-mode) .top:has(.rowbtns){position:relative}
 .page-publico-secundaria:not(.draw-mode) .top:has(.rowbtns) .public-view-switch{position:absolute;right:34px;top:64px;margin:0}
 .draw-mode .top{display:flex!important;align-items:center;justify-content:space-between;gap:20px}
 .draw-mode .top h1{margin:0}.draw-mode .top .rowbtns,.draw-mode .public-view-switch{margin:0}
 .draw-mode .top .rowbtns{margin-left:auto}
 .draw-mode main.wide{padding-top:8px;padding-bottom:22px}
}
@media(min-width:1000px) and (max-height:780px){
 .draw-stage{gap:30px;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr)}
 .draw-wheel-shell{width:min(38vw,calc(100svh - 320px))}.draw-group h3{margin-bottom:12px;font-size:23px}
 .draw-slot{min-height:62px;padding:13px 12px}.draw-group ol{gap:8px}.draw-player{font-size:17px}
 .draw-message{min-height:50px}.draw-message h3{font-size:24px;margin-bottom:6px}.draw-wheel-column{gap:12px}
}
@media(max-width:999px){
 .draw-screen{height:auto;gap:26px}.draw-stage{grid-template-columns:1fr 1fr;gap:30px 22px}
 .draw-wheel-column{grid-column:1/-1;grid-row:1}.draw-wheel-shell{width:min(70vw,470px)}
 .draw-links{display:none}.draw-group h3{font-size:24px;margin-bottom:15px}.draw-slot{min-height:76px;padding:13px 12px;gap:9px}
 .draw-player{font-size:17px}.draw-message{width:100%;min-height:60px}.draw-message p{font-size:14px}
 .draw-bottom{align-items:flex-start;flex-wrap:wrap;gap:22px}.draw-hint{text-align:left}.draw-history{gap:12px}
 .draw-admin-groups{grid-template-columns:1fr}.draw-role{font-size:11px}.wheel-hub{font-size:24px}
}
@media(max-width:520px){
 .draw-stage{gap:24px 12px}.draw-slot{gap:6px;padding:12px 8px;min-height:80px}.draw-player{font-size:14px}
 .draw-position{font-size:12px;width:8px}.draw-slot .dot,.draw-empty-dot{width:8px;height:8px}.draw-role{display:none}
 .draw-slot.draw-target{padding-inline:7px}.draw-message p{max-width:280px;margin:auto}.draw-title{font-size:20px}
 .wheel-pointer{border-left-width:11px;border-right-width:11px;border-top-width:27px;top:-3px}.wheel-hub{border-width:5px;font-size:20px}
 .draw-history li{font-size:13px;gap:6px}.draw-bottom .btn{width:100%;justify-content:center}
}

/* Identidad del colegio, compartida por todas las pantallas del torneo. */
:root{
 --board-dark:#f8f7f2;--board-mid:#f1efe8;--panel:#fff;--panel-2:#f6f5f0;
 --ink:#222429;--ink-muted:#65676c;--line:#dcd9d0;--red:#b61313;--yellow:#ffd00b;
 --gold:#b61313;--gold-soft:#f5e5e2;--good:#286344;--bad:#ad3029;--radius:4px;--shadow:none;
 color-scheme:light
}
body{background:#f8f7f2;color:var(--ink);font-family:'Open Sans',Arial,sans-serif}
body:before{height:8px;background:var(--red);position:fixed;top:0;left:0;right:0;bottom:auto;z-index:100;pointer-events:none}
body:after{content:'';display:block;position:fixed;inset:auto -32vw -36vw auto;width:65vw;height:65vw;transform:rotate(-24deg);z-index:-1;pointer-events:none;background:conic-gradient(#22242909 25%,transparent 0 50%,#22242909 0 75%,transparent 0);background-size:100px 100px;mask-image:none;-webkit-mask-image:none}
h1,h2,h3,h4{font-family:'Sora',Arial,sans-serif;font-weight:600}
h1{letter-spacing:-.045em}h2,h3{letter-spacing:-.025em}
::selection{background:#ffd00b66;color:var(--ink)}
:focus-visible{outline-color:var(--red)}
a{color:var(--red)}
.sitebar,.page-control .sitebar,.page-manual .sitebar,.page-publico-primaria .sitebar,.page-publico-secundaria .sitebar{border-bottom:1px solid var(--line);background:transparent}
.sitebar .event-brand{display:block;flex:none;letter-spacing:normal}
.sitebar .event-brand img{display:block;width:clamp(180px,14vw,240px);height:auto;max-height:calc(var(--sitebar-height,110px) - 24px);object-fit:contain;object-position:left center}
.sitebar nav a{font-family:'Open Sans',Arial,sans-serif;color:#55585e;position:relative;text-decoration:none;padding:12px 0;font-weight:600}
.sitebar nav a:hover,.sitebar nav a[aria-current=page]{color:var(--red);text-decoration:none}
.sitebar nav a[aria-current=page]:after{content:'';position:absolute;height:3px;left:0;right:0;bottom:2px;background:var(--yellow)}
.top .eyebrow,.eyebrow{color:var(--ink-muted)}
.panel,.matchcard{background:var(--panel);border-color:var(--line);box-shadow:none}
.colorcard{background:#fff;border-color:var(--line);border-top-color:var(--c)}
input[type=text],input[type=number],select,textarea{background:#fff;color:var(--ink);border-color:#b9b8b0}
input::placeholder,textarea::placeholder{color:#82838a}
input:hover,select:hover,textarea:hover{border-color:#777971}
input:disabled,select:disabled{background:#f0efe9;color:#777971;border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline-color:var(--red);border-color:var(--red)}
.btn{background:var(--red);border-color:var(--red);color:#fff;font-family:'Open Sans',Arial,sans-serif}
.btn:hover{background:#941010;border-color:#941010;color:#fff}
.btn.ghost{background:#fff;border-color:#c5c1b8;color:var(--ink)}
.btn.ghost:hover{background:#faf1ee;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5}
.category-link{background:#fff;border-color:#c5c1b8;color:var(--ink)}
.category-link:hover{background:#f4efea;color:var(--red)}
.category-link.selected,.category-link.selected:hover{background:var(--red);border-color:var(--red);color:#fff}
nav.tabs{border-bottom-color:var(--line);background:#f8f7f2}
nav.tabs button{background:transparent;color:var(--ink-muted)}
nav.tabs button:hover{background:#f0ece4;color:var(--red)}
nav.tabs button.active{color:var(--red);border-bottom-color:var(--red)}
th{color:var(--ink-muted)}td{border-color:var(--line)}
tbody tr:hover td{background:#f7f5ef}
.round-row td,.round-row:hover td{background:#f0ede5!important;color:var(--ink)}
.group-games tr.round-row{background:#f0ede5}
.warn{background:#fbf3e8;color:#79551e;border-left-color:#b98535}
.good-note{background:#edf5ef;color:#286344;border-left-color:#4a805c}
.vs .side{background:#f7f6f1;border-color:var(--line)}
.vs .side.winner,.bkt-player.adv{background:#edf5ef;border-color:#7caa8b}
.bkt-player.adv .name,.bkt-player.adv .sc{color:#286344}
.arma-box{background:#f6f3ed;border-color:#d3c6b7}
.arma-box h4{font-family:'Sora',Arial,sans-serif}
.score,.pos{color:var(--red)}
.colorbar{background:#e8e5dd}
details{background:#fff;border-color:var(--line)}
.champ-mini{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);color:var(--ink)}
.champ-mini .label,.champ-mini .trophy-mini{color:var(--red)}
.champ-mini .name{font-family:'Sora',Arial,sans-serif;color:var(--ink)}
.champ-mini.pending{background:#f3f1eb;color:var(--ink);border-color:var(--line)}
.champ-mini.pending .label,.champ-mini.pending .trophy-mini{color:var(--ink-muted)}
.bkt-box{background:#fff;border-color:#c8c5bd}
.bkt-box.decided{border-color:#b5b2a8}
.bkt-player{border-color:var(--line)}
.bkt-meta{background:#f4f2eb;color:var(--ink-muted)}
.bkt-roundlabel{color:var(--ink-muted)}
.connector{stroke:#b8b5ab}.connector.lit{stroke:var(--red)}
.page-publico-secundaria .bracket-wrap{background:#fff;border-color:var(--line)}
.config-actions,.page-config .config-actions{background:#fff;border-color:#c5c1b8;box-shadow:0 5px 24px #22242912}
.config-actions>.note{color:var(--ink-muted)}.config-actions>.good-note{color:#286344}
.site-footer{border-color:var(--line)}
.final-standing .rank,.placement-tier>b,.final-standing .mono{font-family:'Open Sans',Arial,sans-serif!important}
.round-clock .expired,.public-round-clock .expired{color:#ad3029}
.public-view-switch [aria-current]{color:var(--red);border-color:var(--red)}
.draw-slot{background:#fff;border-color:#d4d0c6}
.draw-position,.draw-player,.draw-role{color:var(--ink-muted)}
.draw-slot.filled .draw-player{color:var(--ink)}
.draw-empty-dot{border-color:#b3b0a5}
.draw-slot.draw-target{border-color:var(--red);background:#fcf0ed}
.draw-target .draw-player,.draw-target .draw-position{color:var(--red)}
.draw-wheel-shell{filter:drop-shadow(0 10px 12px #22242914)}
.wheel-pointer{border-top-color:var(--red);filter:drop-shadow(0 2px 1px #22242926)}
.wheel-hub{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 2px 8px #22242926;font-family:'Sora',Arial,sans-serif}
.wheel-hub:hover:not(:disabled){background:#f4f1e9}
.wheel-hub:focus-visible{outline-color:var(--red)}
.draw-message p,.draw-history li,.draw-history small,.draw-hint{color:var(--ink-muted)}
@media(min-width:1000px){:root{--sitebar-height:clamp(100px,10.5vh,122px)}
 .page-control .top h1,.page-publico-primaria .top h1,.page-publico-secundaria .top h1{font-family:'Sora',Arial,sans-serif;font-weight:600}
}
@media(max-width:800px){
 .sitebar .event-brand img{width:155px;max-height:72px}
 .sitebar nav{max-width:none;gap:10px 18px}
 .sitebar nav a{font-size:12px}
}
@media(max-width:520px){
 .sitebar{align-items:center}
 .sitebar .event-brand img{width:130px}
 .sitebar nav{max-width:170px;gap:4px 13px}
 .sitebar nav a{font-size:11px;padding:6px 0}
}
@media print{body{background:#fff!important}body:before,body:after{display:none!important}.btn{color:#222429!important}}

/* Rondas sin bandas vacías y resultados integrados en la tabla. */
.group-games .round-row td,.group-games .round-row:hover td{background:transparent!important;border-top:1px solid var(--line);color:var(--red);padding:13px 0 8px;font-weight:600;letter-spacing:.04em}
.group-games tr.round-row{background:transparent}
.group-games .round-row:first-of-type td{border-top:0}
.page-control .group-games td{vertical-align:middle}
.page-control .group-games select{background:#f8f7f3;border-color:#dedbd3;border-radius:4px;min-height:42px;padding:9px 12px;color:var(--ink);font-size:var(--small-size,14px)}
.page-control .group-games select:hover{background:#fff;border-color:#a6a297}
.page-control .group-games select:focus-visible{outline:2px solid var(--red);outline-offset:2px;background:#fff}
@media(max-width:620px){.group-games tr.round-row{padding:0;margin-top:12px}.group-games .round-row td{padding:10px 0 5px}}

/* Ventanas de escritorio con menos altura útil: cuatro filas completas. */
@media(min-width:1001px) and (max-height:800px), (min-width:1500px) and (max-height:950px){
 .page-publico-secundaria:not(.draw-mode) main.wide{grid-template-rows:minmax(225px,.9fr) minmax(0,1.1fr);gap:16px}
 .page-publico-secundaria:not(.draw-mode) main.wide:has(#mb-7){grid-template-rows:minmax(225px,.9fr) minmax(0,1.1fr)}
 .page-publico-secundaria .group-columns .panel{padding:12px 20px;overflow:auto}
 .page-publico-secundaria .group-columns .panel h2{font-size:25px;margin-bottom:8px;line-height:1.2}
 .page-publico-secundaria .group-columns .group-heading{gap:12px}
 .page-publico-secundaria .group-columns table{font-size:clamp(14px,.9vw,17px);line-height:1.3}
 .page-publico-secundaria .group-columns th{font-size:12px;padding:6px 8px;line-height:1.2}
 .page-publico-secundaria .group-columns td{padding:5px 8px;line-height:1.3}
 .page-publico-secundaria .group-columns td .chip{font-size:inherit;line-height:1.3;padding:2px 0}
 .page-publico-secundaria .group-columns .pos{font-size:inherit}
 .page-publico-secundaria .group-columns .tie-criterion{font-size:11px;line-height:1.3}
 .page-publico-secundaria #bracketWrap:has(.public-finals-grid){padding:12px 15px}
 .page-publico-secundaria .public-finals-grid{gap:10px 14px}
 .page-publico-secundaria .public-match{gap:4px;justify-content:center}
 .page-publico-secundaria .public-match .bkt-roundlabel{font-size:12px;margin-bottom:0;line-height:1.2}
 .page-publico-secundaria .public-match .bkt-player{font-size:clamp(15px,1vw,19px);padding:6px 12px;line-height:1.3}
 .page-publico-secundaria .public-match .bkt-player .sc{font-size:20px;line-height:1.2}
 .page-publico-secundaria .public-match .bkt-meta{font-size:10px;line-height:1.2;padding:4px}
}
@media(min-width:1001px) and (max-height:720px){
 .page-publico-secundaria:not(.draw-mode) main.wide,.page-publico-secundaria:not(.draw-mode) main.wide:has(#mb-7){grid-template-rows:minmax(205px,.9fr) minmax(230px,1.1fr);overflow:auto}
 .page-publico-secundaria .group-columns .panel{padding:9px 16px}
 .page-publico-secundaria .group-columns .panel h2{font-size:21px;margin-bottom:5px}
 .page-publico-secundaria .group-columns td{padding-top:3px;padding-bottom:3px}
}

/* La cabecera comparte las proporciones de Torneos en todas las páginas. */
@media(min-width:1001px){
 :root{--sitebar-height:clamp(112px,13.5vh,154px)}
 .sitebar,.page-control .sitebar,.page-manual .sitebar,.page-publico-primaria .sitebar,.page-publico-secundaria .sitebar{width:calc(100% - 96px);max-width:none;height:var(--sitebar-height);min-height:var(--sitebar-height);margin:0 auto;padding:0;align-items:center}
 .sitebar .event-brand img{width:clamp(218px,14.7vw,278px);height:auto;max-height:none}
 .sitebar nav{gap:clamp(24px,2.5vw,48px)}
 .sitebar nav a{font-size:clamp(17px,1.2vw,23px);padding:15px 0}
 .sitebar nav a[aria-current=page]:after{height:4px;bottom:1px}
}
@media(min-width:1001px) and (max-height:800px), (min-width:1500px) and (max-height:950px){
 :root{--sitebar-height:clamp(84px,12.5vh,118px)}
 .sitebar .event-brand img{width:clamp(180px,12vw,230px)}
}
@media(min-width:651px) and (max-width:1000px){
 .sitebar,.page-control .sitebar,.page-manual .sitebar,.page-publico-primaria .sitebar,.page-publico-secundaria .sitebar{width:calc(100% - 48px);max-width:none;margin:0 auto;min-height:110px;height:auto;padding:0;align-items:center}
 .sitebar .event-brand img{width:195px;height:auto;max-height:none}
 .sitebar nav{gap:20px;max-width:none}.sitebar nav a{font-size:15px;padding:15px 0}
}
@media(max-width:650px){
 .sitebar,.page-control .sitebar,.page-manual .sitebar,.page-publico-primaria .sitebar,.page-publico-secundaria .sitebar{width:calc(100% - 36px);max-width:none;margin:0 auto;min-height:105px;height:auto;padding:22px 0 17px;align-items:flex-start;gap:20px}
 .sitebar .event-brand img{width:143px;height:auto;max-height:none}
 .sitebar nav{max-width:190px;justify-content:flex-end;flex-wrap:wrap;gap:6px 14px}
 .sitebar nav a{font-size:12px;padding:6px 0}
}

/* Los contenidos usan los mismos márgenes laterales que Torneos. */
:root{--page-gutter:48px}
@media(max-width:1000px){:root{--page-gutter:24px}}
@media(max-width:650px){:root{--page-gutter:18px}}
.page-control .top,.page-publico-primaria .top,.page-publico-secundaria .top,
.page-control main,.page-publico-primaria main.wide,.page-publico-secundaria main.wide,
.page-control .databar{padding-left:var(--page-gutter);padding-right:var(--page-gutter);max-width:none;width:100%}
.page-control nav.tabs{margin-left:var(--page-gutter);margin-right:var(--page-gutter);width:calc(100% - var(--page-gutter)*2);max-width:none;padding-left:0;padding-right:0}
.page-control .clock-help{margin-left:var(--page-gutter);margin-right:var(--page-gutter)}
.page-config .config-actions{width:calc(100% - var(--page-gutter)*2);max-width:none}

/* La fila de ronda no cambia sus dimensiones al pasar el cursor. */
.page-control .group-games .round-row td,.page-control .group-games .round-row:hover td{padding:7px 12px}

<script data-bundle="rules">
/* =====================================================================
   TORNEO DE AJEDREZ — MODELO COMPARTIDO
   Compartido por configuración y los paneles de las tres categorías.
   Persiste en localStorage y se sincroniza en vivo entre pestañas del
   mismo navegador (misma máquina) vía el evento 'storage' + un poll de
   respaldo, para que publico.html se actualice sola.
   ===================================================================== */

/* ============================= DATOS BASE ============================= */
const ARMAGEDDON_MAX_SECONDS = 15 * 60;
const COLORS = ['rojo','azul','verde','amarillo'];
const COLOR_META = {
  rojo:     {label:'Rojo',     hex:'#bd4d42'},
  azul:     {label:'Azul',     hex:'#4178b0'},
  verde:    {label:'Verde',    hex:'#36815a'},
  amarillo: {label:'Amarillo', hex:'#d7aa36'},
};
const PRIMARY_ROUND_MS = 20 * 60 * 1000;
const PLACE_POINTS_PRIMARIA = {1:30, 2:22, 3:13, 4:13, 5:8, 6:8, 7:3, 8:3};

// Secundaria: patrón de blancas/negras para las 6 partidas de la fase de grupos ([blancas, negras] por slot).
// Los participantes A (Bx internos) juegan 2 con negras y 1 con blancas; los B (Mx), al revés.
// A es quien cursa mayor grado; a igual grado, quien tiene mayor edad. No indica habilidad.
// Reparto de piezas fijo por pareja (igual que antes). El ORDEN en que se listan estas 6 parejas
// está pensado para jugarse en 3 rondas de 2 tableros en paralelo: cada ronda enfrenta a los 4
// jugadores del grupo a la vez (0 y 1 no comparten jugador, ídem 2-3 y 4-5), así ambos tableros
// arrancan y terminan juntos y nadie se queda esperando su siguiente partida.
const PAIR_TEMPLATE = [ ['B1','B2'], ['M1','M2'], ['M1','B1'], ['M2','B2'], ['M2','B1'], ['B2','M1'] ];
const PLACE_POINTS_SECUNDARIA_BAJA = {1:28, 2:20, 3:17, 4:13, 5:8, 6:8, 7:3, 8:3};
const PLACE_POINTS_SECUNDARIA = {1:27, 2:19, 3:16, 4:12, 5:11, 6:7, 7:6, 8:2};
const DEFAULT_POINT_TOTALS = {primaria:126, secundaria_baja:135, secundaria_alta:140};
function placePointsS(mode){ return mode==='primaria'?PLACE_POINTS_PRIMARIA:mode==='secundaria_baja'?PLACE_POINTS_SECUNDARIA_BAJA:PLACE_POINTS_SECUNDARIA; }
function placementPrizeS(place,mode){ return scaledPoints(placePointsS(mode)[place],mode); }
function pairPrizeS(place,mode){ return scaledPoints(pairAverageS(place,mode),mode); }

/* ============================= ALMACENAMIENTO ============================= */
const MODALITIES = [
  {id:'primaria', label:'Primaria', grades:'1.º a 6.º de primaria', factor:1},
  {id:'secundaria_baja', label:'Secundaria baja', grades:'1.º y 2.º de secundaria', factor:1},
  {id:'secundaria_alta', label:'Secundaria alta', grades:'3.º, 4.º y 5.º de secundaria', factor:1},
];
const SECONDARY_MODE = new URLSearchParams(window.location.search).get('categoria')==='alta'
  ? 'secundaria_alta' : 'secundaria_baja';
function modalityMeta(mode){ return MODALITIES.find(m=>m.id===mode); }
const LS_KEYS = {
  setup: 'ajedrez_setup_v2',
  primaria: 'ajedrez_primaria_grupos_v3',
  secundaria_baja: 'ajedrez_secundaria_baja_v2',
  secundaria_alta: 'ajedrez_secundaria_alta_v2',
};
function secondaryNav(page){
  return MODALITIES.filter(m=>m.id!=='primaria').map(m=>
    `<a class="category-link ${m.id===SECONDARY_MODE?'selected':''}" href="${page}?categoria=${m.id==='secundaria_alta'?'alta':'baja'}" ${m.id===SECONDARY_MODE?'aria-current="page"':''}>${m.label}</a>`
  ).join('');

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
// Se conservan los decimales: el ajuste de reparto y la escala olímpica son factores separados.
function scaledPoints(points, mode){ return Number((points*modalityWeight(mode)).toFixed(10)); }
function formatPoints(points){ return Number(points).toLocaleString('es-PE', {maximumFractionDigits:10}); }

function loadJSON(key, fallback){

  };

function getSetup(){
  const s = loadJSON(LS_KEYS.setup, null);
  const fresh = freshSetup();
  if(!s) return fresh;
  return {
    ...fresh, ...s,
    ...Object.fromEntries(MODALITIES.map(m=>[m.id,{
      players:{...fresh[m.id].players,...((s[m.id]&&s[m.id].players)||{})},
    }])),

    pointTotals:Object.fromEntries(MODALITIES.map(m=>{

      // Convertir los totales personalizados anteriores; el antiguo valor por defecto se actualiza.
      const legacy=Number(s.weights?.[m.id]);

// Los premios son porcentajes; la escala se deriva del total configurable de cada categoría.
function modalityTotal(mode,setup=getSetup()){

function modalityWeight(mode){ return modalityTotal(mode)/100; }

// El plazo absoluto conserva el tiempo al recargar o cambiar de pestaña.
function primaryTimer(S, round=S.activeRound||0){
  return S.roundTimers?.[round] || {remainingMs:PRIMARY_ROUND_MS, deadline:null, started:false};
}
function primaryRemaining(S, round=S.activeRound||0, now=Date.now()){
  const timer=primaryTimer(S,round);
  return Math.max(0,timer.deadline==null ? timer.remainingMs : timer.deadline-now);
}
function setPrimaryTimer(S, action, round=S.activeRound||0, now=Date.now()){
  if(!Number.isInteger(round) || round<0 || round>2) return false;
  S.roundTimers ||= {};
  const timer={...primaryTimer(S,round)};
  if(action==='reset') S.roundTimers[round]={remainingMs:PRIMARY_ROUND_MS,deadline:null,started:false};
  else if(action==='pause') S.roundTimers[round]={...timer,remainingMs:primaryRemaining(S,round,now),deadline:null};
  else if(action==='start'){
    // Una sola ronda puede estar corriendo. No reiniciar un reloj activo.
    if(timer.deadline!=null || primaryRemaining(S,round,now)<=0 || Object.keys(S.roundTimers).some(r=>Number(r)!==round && S.roundTimers[r].deadline>now)) return false;
    S.roundTimers[round]={remainingMs:timer.remainingMs,deadline:now+timer.remainingMs,started:true};
  } else return false;
  S.activeRound=round;
  return true;
}
function primaryMaterialResult(white,black){ return Math.abs(white-black)>1 ? (white>black?'white':'black') : 'draw'; }

/* Suscripción a cambios en vivo (para que las páginas se refresquen solas). */
function onLiveUpdate(cb){
  const keys=Object.values(LS_KEYS);
  window.addEventListener('storage', e=>{ if(keys.includes(e.key)) cb(e.key); });
  window.addEventListener('torneo:local-update', e=>cb(e.detail.key));
  const previous=Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]));
  setInterval(()=>keys.forEach(key=>{
    const value=localStorage.getItem(key);
    if(value!==previous[key]){ previous[key]=value; cb(key); }
  }),1500);
}

/* ============================= HELPERS DE JUGADORES ============================= */
function pid(color, role){ return color+':'+role; }
function pidColor(p){ return p.split(':')[0]; }
function pidRole(p){ return p.split(':')[1]; }
function playerName(p, mode='primaria'){
  const setup = getSetup();
  const bucket = setup[mode] || setup.primaria;
  const c = pidColor(p), r = pidRole(p);
  const n = bucket.players[c] && bucket.players[c][r];
  if(n && n.trim()) return escapeHTML(n.trim());
  return `${COLOR_META[c].label} — participante ${r==='bueno'?'Mayor':'Menor'}`;
}
function penaltyOf(p, mode='primaria'){
  // La conducta es del color, no de la modalidad: mode se ignora aquí y solo se conserva
  // en la firma para no tener que tocar cada llamada existente (playerName/chip sí lo usan).
  const setup = getSetup();
  return Number(setup.conduct[pidColor(p)])||0;
}
function chip(p, mode='primaria'){
  const c = pidColor(p);
  return `<span class="chip"><span class="dot" style="--c:${COLOR_META[c].hex}"></span>${playerName(p, mode)}</span>`;
}

function shuffleSeedArr(mode){
  const arr = [...COLORS];
  for(let i=arr.length-1;i>0;i--){
    const j = randomIndexS(i+1);
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  if(mode==='secundaria_alta' && (arr.indexOf('verde')<2)===(arr.indexOf('rojo')<2)) return shuffleSeedArr(mode);
  return arr;
}
function randomIndexS(length){
  // Rechazo del sobrante para no sesgar las opciones al reducir el entero.
  const limit=Math.floor(0x100000000/length)*length, bytes=new Uint32Array(1);
  do{ crypto.getRandomValues(bytes); }while(bytes[0]>=limit);
  return bytes[0]%length;
}

/* Sorteo público. El orden se guarda antes de animar; una recarga solo lo revela. */
const DRAW_TARGETS = [
  [{group:'A',position:0,role:'bueno'},{group:'B',position:2,role:'malo'}],
  [{group:'B',position:0,role:'bueno'},{group:'A',position:2,role:'malo'}],
  [{group:'A',position:1,role:'bueno'},{group:'B',position:3,role:'malo'}],
  [{group:'B',position:1,role:'bueno'},{group:'A',position:3,role:'malo'}],
];
function groupLabelS(group){ return `Grupo ${group==='A'?1:2}`; }
function validDrawS(draw){
  const validSpin=spin=>spin && Number.isInteger(spin.step) && spin.step>=0 && spin.step<3
    && Number.isFinite(spin.startedAt) && Number.isFinite(spin.durationMs) && spin.durationMs>0 && spin.durationMs<=10000
    && Number.isFinite(spin.angle) && spin.angle>0 && spin.angle<10000;
  return draw && draw.version===1 && Array.isArray(draw.order) && draw.order.length===4
    && draw.order.every(c=>COLORS.includes(c)) && new Set(draw.order).size===4
    && Number.isInteger(draw.revealed) && [0,1,2,4].includes(draw.revealed)
    && Number.isFinite(draw.readyAt)
    && (!draw.spin || (validSpin(draw.spin) && draw.spin.step===draw.revealed))
    && (!draw.lastSpin || (validSpin(draw.lastSpin) && draw.revealed===(draw.lastSpin.step===2?4:draw.lastSpin.step+1)));
}
function drawSlotsS(S){
  const groups={A:Array(4).fill(null),B:Array(4).fill(null)};
  if(S.groups) return Object.fromEntries(['A','B'].map(g=>[g,S.groups[g].map(x=>x.pid)]));
  if(!validDrawS(S.draw)) return groups;
  for(let i=0;i<S.draw.revealed;i++) for(const target of DRAW_TARGETS[i])
    groups[target.group][target.position]=pid(S.draw.order[i],target.role);
  return groups;
}
function startDrawSpinS(S,now=Date.now()){
  if(S.groups) return false;
  if(!S.draw){
    const seed=shuffleSeedArr(S.category);
    S.draw={version:1,order:[seed[0],seed[2],seed[1],seed[3]],revealed:0,spin:null,lastSpin:null,readyAt:0};
  }
  const draw=S.draw;
  if(!validDrawS(draw) || draw.spin || draw.revealed===4 || now<draw.readyAt) return false;
  const step=draw.revealed,remaining=COLORS.filter(c=>!draw.order.slice(0,step).includes(c));
  const winnerIndex=remaining.indexOf(draw.order[step]),slice=360/remaining.length;
  const offset=(randomIndexS(1001)/1000-.5)*slice*.42;
  const angle=6*360+(360-(winnerIndex+.5)*slice+offset+360)%360;
  draw.spin={step,startedAt:now,durationMs:4800,angle};
  draw.lastSpin=null;
  return true;
}
function settleDrawSpinS(S,now=Date.now()){
  const draw=S.draw;
  if(!validDrawS(draw) || !draw.spin || now<draw.spin.startedAt+draw.spin.durationMs) return false;
  draw.lastSpin=draw.spin;
  draw.revealed=draw.spin.step===2?4:draw.spin.step+1;
  draw.readyAt=draw.spin.startedAt+draw.spin.durationMs+1700;
  draw.spin=null;
  return true;
}
function confirmDrawGroupsS(S,now=Date.now()){
  if(S.groups || !validDrawS(S.draw) || S.draw.spin || S.draw.revealed!==4 || now<S.draw.readyAt) return false;
  const [c1,c2,c3,c4]=S.draw.order;
  S.seedOrder=[c1,c3,c2,c4];
  return confirmGroupsS(S);
}
function ensureArmageddon(match, maxSeconds=ARMAGEDDON_MAX_SECONDS){
  maxSeconds = Math.min(ARMAGEDDON_MAX_SECONDS, maxSeconds);
  // Al cambiar el tope, las pujas pendientes se repiten; un ganador registrado se conserva.
  if(!match.armageddon || (!match.armageddon.winnerPid && match.armageddon.maxSeconds!==maxSeconds)) match.armageddon = {maxSeconds, bid1:null, bid2:null, attempts:0, resolvedColors:null, winnerPid:null};
  return match.armageddon;
}
function registerArmageddonBid(match, maxSeconds, n1, n2){
  const A = ensureArmageddon(match, maxSeconds);
  n1 = Math.max(0, Math.min(A.maxSeconds, Math.floor(Number(n1)||0)));
  n2 = Math.max(0, Math.min(A.maxSeconds, Math.floor(Number(n2)||0)));
  if(n1===n2){ A.attempts++; A.bid1=n1; A.bid2=n2; return {tie:true}; }
  if(n1<n2) A.resolvedColors = {blackPid:match.p1, whitePid:match.p2, blackSeconds:n1};
  else A.resolvedColors = {blackPid:match.p2, whitePid:match.p1, blackSeconds:n2};
  return {tie:false};
}
function setArmageddonWinner(match, winnerPid){
  match.armageddon.winnerPid = winnerPid;
}

/* ============================= SECUNDARIA: FASE DE GRUPOS ============================= */
function seedCompleteS(S){
  return S.seedOrder.every(c=>c) && new Set(S.seedOrder).size===4;
}
function confirmGroupsS(S){
  if(!seedCompleteS(S)) return false;
  const [c1,c2,c3,c4] = S.seedOrder;
  // Grupo A: participantes A de c1,c2 y B de c3,c4. Grupo B: reparto inverso.
  const groupA = [
    {slot:'B1', pid: pid(c1,'bueno')},
    {slot:'B2', pid: pid(c2,'bueno')},
    {slot:'M1', pid: pid(c3,'malo')},
    {slot:'M2', pid: pid(c4,'malo')},
  ];
  const groupB = [
    {slot:'B1', pid: pid(c3,'bueno')},
    {slot:'B2', pid: pid(c4,'bueno')},
    {slot:'M1', pid: pid(c1,'malo')},
    {slot:'M2', pid: pid(c2,'malo')},
  ];
  S.groups = {A:groupA, B:groupB};
  const buildGames = (g) => PAIR_TEMPLATE.map(([w,b])=>({
    white: g.find(x=>x.slot===w).pid,
    black: g.find(x=>x.slot===b).pid,
    result: null,
  }));
  S.groupGames = { A: buildGames(groupA), B: buildGames(groupB) };
  S.manualOverride = {};
  S.final = null;
  S.placementMatches = {};
  S.colorChoiceOverride = {};
  return true;
}

/* ---- Desempate genérico (compartido entre grupos y cruces 5º-8º) ---- */
function clusterBy(arr, keyFn){
  const groups = new Map();
  arr.forEach(x=>{
    const k = keyFn(x);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(x);
  });
  return [...groups.entries()].sort((a,b)=>b[0]-a[0]).map(([,v])=>v);
}
function rankPlayers(pids, games, pointsOf, sbOf, winsOf, conductOf, overrideOf, unresolved=[]){
  const byPoints = clusterBy(pids, pointsOf);
  let out = [];
  for(const cluster of byPoints) out.push(...resolveCluster(cluster));
  return out;

  function resolveCluster(cluster){
    if(cluster.length<=1) return cluster;
    const mini = {}; cluster.forEach(p=>mini[p]=0);
    for(const g of games){
      if(!g.result) continue;
      if(cluster.includes(g.white) && cluster.includes(g.black)){
        if(g.result==='white') mini[g.white]+=2;
        else if(g.result==='black') mini[g.black]+=2;
        else { mini[g.white]+=1; mini[g.black]+=1; }
      }
    }
    const subs = clusterBy(cluster, p=>mini[p]);
    let res=[];
    for(const sub of subs){
      if(sub.length===1){ res.push(sub[0]); continue; }
      if(sub.length===2){
        const g = games.find(g=> (g.white===sub[0]&&g.black===sub[1]) || (g.white===sub[1]&&g.black===sub[0]));
        if(g && g.result){
          if(g.result==='draw'){
            res.push(g.black, sub.find(p=>p!==g.black));
          } else {
            const w = g.result==='white'?g.white:g.black;
            res.push(w, sub.find(p=>p!==w));
          }
        } else {
          res.push(...bySB(sub));
        }
        continue;
      }
      res.push(...bySB(sub));
    }
    return res;
  }
  function bySB(sub){
    let res=[];
    for(const c of clusterBy(sub, sbOf)){
      if(c.length===1){res.push(c[0]); continue;}
      for(const c2 of clusterBy(c, winsOf)){
        if(c2.length===1){res.push(c2[0]); continue;}
        for(const c3 of clusterBy(c2, conductOf)){
          if(c3.length===1){res.push(c3[0]); continue;}
          for(const roleCluster of clusterBy(c3, p=>pidRole(p)==='malo'?1:0)) for(const c4 of clusterBy(roleCluster, overrideOf)){
            if(c4.length>1) unresolved.push(c4);
            res.push(...c4);
          }
        }
      }
    }
    return res;
  }
}
function groupStatsS(S, g){
  const gps = S.groups[g];
  const pids = gps.map(x=>x.pid);
  const games = S.groupGames[g];
  const points={}, wins={};
  pids.forEach(p=>{points[p]=0; wins[p]=0;});
  for(const gm of games){
    if(!gm.result) continue;
    if(gm.result==='white'){ points[gm.white]+=2; wins[gm.white]++; }
    else if(gm.result==='black'){ points[gm.black]+=2; wins[gm.black]++; }
    else { points[gm.white]+=1; points[gm.black]+=1; }
  }
  const sb={};
  pids.forEach(p=>{
    let s=0;
    for(const gm of games){
      if(!gm.result) continue;
      if(gm.white===p){
        if(gm.result==='white') s+=points[gm.black];
        else if(gm.result==='draw') s+=points[gm.black]*0.5;
      } else if(gm.black===p){
        if(gm.result==='black') s+=points[gm.white];
        else if(gm.result==='draw') s+=points[gm.white]*0.5;
      }
    }
    sb[p]=s;
  });
  return {pids, games, points, wins, sb};
}
function overrideOfS(S, p){ return S.manualOverride[p]||0; }
// Para el desempate: menos penalizaciones = mejor, por eso se usa el valor negado como "puntaje" a maximizar.
function conductRankKeyS(p){ return -penaltyOf(p); }
function groupRankingS(S, g){
  const st=groupStatsS(S,g), unresolved=[];
  const order=rankPlayers(st.pids,st.games,p=>st.points[p],p=>st.sb[p],p=>st.wins[p],conductRankKeyS,p=>overrideOfS(S,p),unresolved);
  return {order,unresolved};
}
function groupOrderS(S,g){ return groupRankingS(S,g).order; }
function groupCompleteS(S,g){ return !!S.groupGames && S.groupGames[g].every(gm=>gm.result); }
function unresolvedPairsS(S,order,g){
  return groupRankingS(S,g).unresolved.flatMap(tied=>tied.slice(1).map((p,i)=>[tied[i],p]));
}
function groupLeaderS(S,g){
  if(!S.groups || !groupCompleteS(S,g)) return null;
  const {order,unresolved}=groupRankingS(S,g);
  return unresolved.some(tied=>tied.includes(order[0])) ? null : order[0];
}
function setOverrideWinnerS(S, p, otherP){
  const cur = Math.max(overrideOfS(S,p), overrideOfS(S,otherP));
  S.manualOverride[p] = cur+1;
}
function combinedStatsS(S){
  const a = groupStatsS(S,'A'), b = groupStatsS(S,'B');
  return {
    points:{...a.points,...b.points},
    sb:{...a.sb,...b.sb},
    wins:{...a.wins,...b.wins},
  };
}

/* ---- Explicación de desempate (para mostrar en arbitro/publico SOLO cuando de verdad decide algo) ----
   Cascada real (ver rankPlayers): puntos -> enfrentamiento directo (si el empate, tras el mini-torneo
   entre los empatados, se reduce a exactamente 2 jugadores que ya se enfrentaron) -> SB -> victorias
   -> conducta -> B o Menor efectivo. Devuelve null si a y b no están empatados en puntos
   (no hace falta desempatar) o si están en empate total tras todos los criterios. */
function tieBreakLabelS(S, g, a, b){
  const st = groupStatsS(S, g);
  if(st.points[a] !== st.points[b]) return null;
  const gm = st.games.find(x => (x.white===a && x.black===b) || (x.white===b && x.black===a));
  if(gm && gm.result) return 'enfrentamiento directo';
  if(st.sb[a] !== st.sb[b]) return 'SB (Sonneborn-Berger)';
  if(st.wins[a] !== st.wins[b]) return 'victorias';
  if(penaltyOf(a) !== penaltyOf(b)) return 'conducta';
  if(pidRole(a)!==pidRole(b)) return 'prioridad Menor';
  if(overrideOfS(S,a) !== overrideOfS(S,b)) return 'Menor efectivo (grado y nacimiento)';
  return 'empate total (sin desempate)';
}
// Misma idea para comparar jugadores de grupos distintos (5º-8º puesto): no hay partidos entre
// ellos, así que el enfrentamiento directo nunca aplica aquí.
function tieBreakLabelCombinedS(S, a, b){
  const cs = combinedStatsS(S);
  if(cs.points[a] !== cs.points[b]) return null;
  if(cs.sb[a] !== cs.sb[b]) return 'SB (Sonneborn-Berger)';
  if(cs.wins[a] !== cs.wins[b]) return 'victorias';
  if(penaltyOf(a) !== penaltyOf(b)) return 'conducta';
  if(pidRole(a)!==pidRole(b)) return 'prioridad Menor';
  if(overrideOfS(S,a) !== overrideOfS(S,b)) return 'Menor efectivo (grado y nacimiento)';
  return 'empate total (sin desempate)';
}

/* ---- Motor de partidos de secundaria (final directa: colorChoice + Armagedón) ---- */
function gameColorsS(match, idx){
  const parity = idx%2===0;
  const p1White = parity ? (match.colorChoice==='p1-white') : (match.colorChoice==='p1-black');
  return p1White? {white:match.p1, black:match.p2} : {white:match.p2, black:match.p1};
}
function matchTallyS(match){
  let s1=0,s2=0, played=0;
  match.games.forEach((gm,i)=>{
    if(!gm.result) return;
    played++;
    const {white} = gameColorsS(match, i);
    const val = gm.result==='draw'?0.5:1;
    if(gm.result==='draw'){ s1+=0.5; s2+=0.5; }
    else if((gm.result==='white'&&white===match.p1)||(gm.result==='black'&&white!==match.p1)) s1+=val;
    else s2+=val;
  });
  return {s1,s2,played};
}
function matchWinnerS(match){
  if(!match.colorChoice) return null;
  const t = matchTallyS(match);
  if(t.played < match.games.length) return null;
  if(t.s1>t.s2) return match.p1;
  if(t.s2>t.s1) return match.p2;
  if(match.games.length===2 && match.armageddon && match.armageddon.winnerPid) return match.armageddon.winnerPid;
  return null;
}
function needsArmageddonS(match){
  if(!match.colorChoice || match.games.length!==2) return false;
  const t = matchTallyS(match);
  return t.played===match.games.length && t.s1===t.s2;
}
// Comparación entre líderes: puntos, SB, victorias, conducta y Menor efectivo. Sin enfrentamiento directo.
function finalColorRankingS(S, match=S.final){
  const pids=match ? [match.p1,match.p2] : [groupLeaderS(S,'A'),groupLeaderS(S,'B')];
  if(pids.some(p=>!p)) return {order:[],unresolved:[]};
  const cs=combinedStatsS(S), unresolved=[];
  const order=rankPlayers(pids,[],p=>cs.points[p],p=>cs.sb[p],p=>cs.wins[p],conductRankKeyS,p=>(match?.colorChoiceOverride || (match===S.final?S.colorChoiceOverride:null))?.[p]||0,unresolved);
  return {order,unresolved};
}
function finalColorChooserS(S,match=S.final){
  const ranking=finalColorRankingS(S,match);
  return ranking.unresolved.length ? null : ranking.order[0]||null;
}
function placementLabelS(place){ return place>=3 ? `${place}.º-${place+1}.º` : `${place}.º`; }
function placementTiersS(S){ return placementRowsS(S); }
function placementPlacesS(S){ return S.category==='secundaria_alta'?[3,5,7]:S.category==='secundaria_baja'?[3]:[]; }
function groupPositionS(S,g,index){
  if(!S.groups || !groupCompleteS(S,g)) return null;
  const r=groupRankingS(S,g),p=r.order[index];
  return r.unresolved.some(t=>t.includes(p))?null:p;
}
function matchCompleteS(match){
  return !!match?.colorChoice && match.games.every(g=>g.result) && (match.games.length===1 || !!matchWinnerS(match));
}
function tournamentCompleteS(S){ return !!S.final && matchCompleteS(S.final) && placementPlacesS(S).every(p=>matchCompleteS(S.placementMatches?.[p])); }

function placementRowsS(S){
  if(!S.groups || !['A','B'].every(g=>groupCompleteS(S,g))) return [];
  if(['A','B'].some(g=>groupRankingS(S,g).unresolved.length)) return [];
  const oa=groupOrderS(S,'A'),ob=groupOrderS(S,'B'),rows=[];
  const add=(place,label,players,points,provisional=false)=>rows.push({place,label,players,points,provisional});
  const a=oa[0],b=ob[0],winner=S.final&&matchWinnerS(S.final),points=placePointsS(S.category);
  if(winner){add(1,'1.º',[winner],points[1]);add(2,'2.º',[winner===a?b:a],points[2]);}
  else add(2,'1.º–2.º',[a,b],points[2],true);
  [3,5,7].forEach((place,i)=>{
    const players=[oa[i+1],ob[i+1]];
    if(!placementPlacesS(S).includes(place)){add(place,`${place}.º–${place+1}.º`,players,points[place]);return;}
    const match=S.placementMatches?.[place],w=match&&matchWinnerS(match);
    if(w){add(place,`${place}.º`,[w],points[place]);add(place+1,`${place+1}.º`,[players.find(p=>p!==w)],points[place+1]);}
    else add(place,`${place}.º–${place+1}.º`,players,pairAverageS(place,S.category),!matchCompleteS(match));
  });

}
function playerPointsS(S,p){return placementRowsS(S).find(r=>r.players.includes(p))?.points||0;}
function colorPointsS(S){
  const totals=Object.fromEntries(COLORS.map(c=>[c,0]));
  for(const row of placementRowsS(S))for(const p of row.players)totals[pidColor(p)]+=row.points;
  return Object.fromEntries(COLORS.map(c=>[c,scaledPoints(totals[c],S.category)]));
}
function validTournamentS(S,mode){
  const validPid=p=>typeof p==='string' && COLORS.includes(pidColor(p)) && ['bueno','malo'].includes(pidRole(p));

    && (!S.placementMatches || (typeof S.placementMatches==='object' && !Array.isArray(S.placementMatches) && Object.entries(S.placementMatches).every(([p,m])=>placementPlacesS(S).includes(Number(p)) && m.place===Number(p) && validMatch(m,1))));

  return true;
}
// Al corregir grupos, no se conservan resultados de una final con otros participantes.
function autoAdvanceS(S){
  S.placementMatches ||= {};
  if(!S.groups){ S.final=null; S.placementMatches={}; return; }
  const p1=groupLeaderS(S,'A'), p2=groupLeaderS(S,'B');
  if(!p1 || !p2){S.final=null; S.colorChoiceOverride={};}
  else if(!S.final || S.final.p1!==p1 || S.final.p2!==p2){ S.colorChoiceOverride={}; generateFinalS(S); }
  const allowed=placementPlacesS(S);
  for(const place of Object.keys(S.placementMatches))if(!allowed.includes(Number(place)))delete S.placementMatches[place];
  for(const place of allowed){
    const index=(place-1)/2,a=groupPositionS(S,'A',index),b=groupPositionS(S,'B',index),old=S.placementMatches[place];
    if(!a || !b){delete S.placementMatches[place];continue;}
    if(!old || old.p1!==a || old.p2!==b)S.placementMatches[place]={p1:a,p2:b,place,colorChoice:null,colorChoiceOverride:{},games:[{result:null}]};
  }
}
function provisionalFinalS(S){
  if(S.final) return S.final;
  if(!S.groups) return null;
  return {provisional:true,p1:groupLeaderS(S,'A'),p2:groupLeaderS(S,'B')};
}

/* ============================= SECUNDARIA: PUNTOS OLIMPIADA ============================= */
function computePlacementsS(S){
  const rows=placementRowsS(S);if(!rows.length)return null;
  return Object.fromEntries(rows.flatMap(r=>r.players.map(p=>[p,r.place])));
}

}

function bktPlayerRowS(slot, whichP){
  if(!slot) return `<div class="bkt-player"><div class="who"><span class="dot" style="--c:var(--line)"></span><span class="name" style="color:var(--ink-muted)">Por definir</span></div><div class="sc">–</div></div>`;
  const p = whichP===1?slot.p1:slot.p2;
  if(!p) return `<div class="bkt-player"><div class="who"><span class="dot" style="--c:var(--line)"></span><span class="name" style="color:var(--ink-muted)">Por definir</span></div><div class="sc">–</div></div>`;
  const c = pidColor(p);
  if(slot.provisional || !slot.colorChoice){
    return `<div class="bkt-player adv"><div class="who"><span class="dot" style="--c:${COLOR_META[c].hex}"></span><span class="name">${nameShort(p)}</span></div><div class="sc">–</div></div>`;
  }
  const t = matchTallyS(slot);
  const sc = whichP===1?t.s1:t.s2;
  const winner = matchWinnerS(slot);
  const adv = winner && winner===p;
  return `
    <div class="bkt-player ${adv?'adv':''}">
      <div class="who"><span class="dot" style="--c:${COLOR_META[c].hex}"></span><span class="name">${nameShort(p)}</span></div>
      <div class="sc">${sc}</div>
    </div>`;
}
function bktMetaS(slot){
  if(!slot) return `<div class="bkt-meta">Sin definir</div>`;
  if(slot.provisional) return `<div class="bkt-meta">Pendiente de completar grupos</div>`;
  if(!slot.colorChoice) return `<div class="bkt-meta">Falta elegir color</div>`;
  if(!matchWinnerS(slot) && needsArmageddonS(slot)) return `<div class="bkt-meta">Empate — Armagedón en curso</div>`;
  const winner = matchWinnerS(slot);
  if(winner) return `<div class="bkt-meta">Definido</div>`;
  const t = matchTallyS(slot);
  if(t.played>0) return `<div class="bkt-meta">En curso</div>`;
  return `<div class="bkt-meta">Sin jugar</div>`;
}
function bktBoxS(id, slot){
  const decided = slot && !slot.provisional && slot.colorChoice && !!matchWinnerS(slot);
  return `<div class="bkt-box ${!slot?'empty':''} ${decided?'decided':''}" id="${id}">
    ${bktPlayerRowS(slot,1)}
    ${bktPlayerRowS(slot,2)}
    ${bktMetaS(slot)}
  </div>`;
}

function renderColorPoints(){
  const placements = computePlacementsS(S);
  const colorTotals = colorPointsS(S);
  const hasAny = placements && Object.keys(placements).length>0;
  const maxTotal = Math.max(1,...Object.values(colorTotals));
  const colorRanked = COLORS.slice().sort((a,b)=>colorTotals[b]-colorTotals[a]);
  return `
  <div class="panel">
    <h2>Puntaje por color</h2>
    ${hasAny && !(S.final && matchWinnerS(S.final)) ? `<div class="note">Provisional: falta resolver la final.</div>` : ''}
    ${!hasAny ? `<div class="note">Aún no hay resultados.</div>` : colorRanked.map((c,i)=>`
      <div class="final-standing">
        <div class="rank">${i+1}º</div>
        <div style="width:110px" class="mono" style="color:${COLOR_META[c].hex}">${COLOR_META[c].label}</div>
        <div class="colorbar"><div style="width:${(colorTotals[c]/maxTotal*100)}%; background:${COLOR_META[c].hex}"></div></div>
        <div class="mono" style="min-width:70px; text-align:right">${formatPoints(colorTotals[c])}</div>
      </div>
    `).join('')}
  </div>`;
}

function render(){
  if(publicDraw.render(S)){ document.getElementById('public-round-clock').hidden=true; return; }
  document.getElementById('public-round-clock').hidden=!S.groups || !!S.final;
  updatePrimaryClock();
  const finalSlot = S.final || provisionalFinalS(S);
  const champion = S.final ? matchWinnerS(S.final) : null;

  document.getElementById('app').innerHTML = `
  <div class="group-columns">
    ${renderStandings('A')}
    ${renderStandings('B')}
  </div>

  <div class="public-layout">
    <div class="bracket-wrap" id="bracketWrap">
      <div class="bracket">
        <div class="bracket-col col-final">
          <div>
            <div class="bkt-roundlabel">Final</div>
            ${bktBoxS('mb-final', finalSlot)}
          </div>
        </div>
      </div>
      
    </div>
    <div class="public-sidebar">
      ${champion ? `
        <div class="champ-mini">
          <span class="trophy-mini" aria-hidden="true">♛</span>
          <div><div class="label">Campeón</div><div class="name">${nameShort(champion)}</div></div>
        </div>
      ` : `
        <div class="champ-mini pending">
          <span class="trophy-mini" aria-hidden="true">♛</span>
          <div><div class="label">Campeón</div><div class="name">Aún sin definir</div></div>
        </div>
      `}
      ${renderColorPoints()}
    </div>
  </div>
  `;

}

onLiveUpdate((key)=>{
  if(key===LS_KEYS[MODE] || key===LS_KEYS.setup){ S = getPrimaria(); render(); }
});


function updatePrimaryClock(){
  const clock=document.getElementById('round-clock');
  if(!clock) return;
  const remaining=primaryRemaining(S),seconds=Math.ceil(remaining/1000),timer=primaryTimer(S);
  clock.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
  clock.classList.toggle('expired',remaining===0);
  const status=document.getElementById('round-clock-status');
  const phase=remaining===0?'Tiempo cumplido · congelar tableros':timer.deadline!=null?'En curso':timer.started?'En pausa':'Sin iniciar';
  status.textContent=`Ronda ${(S.activeRound||0)+1} · ${phase}`;
  const start=document.getElementById('timer-start'),pause=document.getElementById('timer-pause');
  if(start){start.textContent=timer.started?'Reanudar':'Iniciar';start.disabled=timer.deadline!=null||remaining===0;pause.disabled=timer.deadline==null||remaining===0;}
}
setInterval(updatePrimaryClock,250);
render();
</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    const prepare = () => navigator.serviceWorker.register('sw.js', {updateViaCache:'none'})
      .then(() => navigator.serviceWorker.ready)
      .then(() => console.debug('ajedrez: static shell cached'))
      .catch(() => {});
    if ('requestIdleCallback' in window) requestIdleCallback(prepare, {timeout:2500});
    else setTimeout(prepare, 1000);
  }, {once:true});
}
